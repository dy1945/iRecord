<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E3A46"/>
      <stop offset="1" stop-color="#071F27"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".10"/>
      <stop offset=".45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#plate)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <!-- cascading stitched frames -->
  <rect x="382" y="290" width="340" height="230" rx="52" fill="#FFFFFF" opacity=".32"/>
  <rect x="342" y="397" width="340" height="230" rx="52" fill="#FFFFFF" opacity=".62"/>
  <rect x="302" y="504" width="340" height="230" rx="52" fill="#FFFFFF"/>
  <!-- record dot on the front frame -->
  <circle cx="472" cy="619" r="54" fill="#FF453A"/>
</svg>
