<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232836"/>
      <stop offset="1" stop-color="#14171F"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".12"/>
      <stop offset=".45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#plate)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <!-- lens ring -->
  <circle cx="512" cy="512" r="250" fill="none" stroke="#FFFFFF" stroke-width="52"/>
  <!-- record dot -->
  <circle cx="512" cy="512" r="105" fill="#FF453A"/>
  <!-- live indicator satellite -->
  <circle cx="688.8" cy="335.2" r="30" fill="#FFFFFF"/>
</svg>
